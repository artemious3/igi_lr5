<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/MEDIA/icon.png" type="image/png" />
    <script>
      const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
      document.cookie = "django_timezone=" + timezone;
    </script>
    <meta name="author" content="Artsiom Padhaiski" />
    <meta
      name="description"
      content="Service center, specialized on repair of computer and electronics devices, located in city X"
    />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
		<link rel="stylesheet" href="/static/base.css">
		<link rel="stylesheet" href="/static/theme-changer.css">
		<link rel="stylesheet" href="/static/nav.css">
		<link rel="stylesheet" href="/static/form_django.css">
		<link rel="stylesheet" href="/static/age-checker.css">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
		<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono:wght@100..900&display=swap">
		<link rel="stylesheet" href="/static/preloader.css">

		<script src="/static/js/theme-switcher.js"></script>
		<script src="/static/js/check-age.js"></script>


		<!-- <script src="/static/js/theme-switcher.js"></script> -->

    <title>{% block title %}Service center{% endblock title %}</title>
		{% block styles %} {% endblock styles %}
  </head>
  <body>
    {% include './age-checker.html' %}
    <header>
      <nav >
        {% block nav %}
          <div id="top-nav" class="top-nav">
            <a class="nav-btn" href="/">Index</a>
						<a class="nav-btn about" href="/service/about">About</a>
            <a class="nav-btn" href="/service/profile">Home</a>
          </div>
        {% endblock nav %}
      </nav>
      <h1>{% block header %}{% endblock header %}</h1>
      <img class="top-icon border" src="/MEDIA/icon.png" alt="Icon" title="Service center"/>
    </header>

    <main>
      <div>{% block content%}{% endblock content %}</div>
    </main>

    <footer>
      <div class="copyright_note">Artsiom Padhaiski. &copy; 2025. All rights reserved<a style="text-decoration:none" href="/bamboleo">.</a></div>
			<!-- <a href="#top-nav"><i class="fa-solid fa-arrow-up"></i></a> -->
    </footer>

		<div class="theme-changer">
			<p class="theme-light">light</p>
			<p class="theme-dark">dark</p>
		</div>
  </body>
</html>
