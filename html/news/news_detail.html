{% extends "./base.html" %} {% block content %}

<article>
	
<section itemscope itemtype="https://schema.org/NewsArticle">
  <h2 itemprop="headline">{{news.head}}</h2>
	<p itemprop="datePublished">{{news.date}}</p>
  <p itemprop="articleBody">{{news.content}}</p>
  <img itemprop="thumbnail" src="{{news.image.url}}" alt="" />
</section>

</article>

{% endblock content %}
