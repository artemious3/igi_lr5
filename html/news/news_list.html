{% extends "./base.html" %}

{% block content %}

<ul> 
    <!-- Iterate over object_list -->
    {% for object in object_list %} 

    <h3>{{ object.head }}</h3> 

		<p>{{object.brief_content}}</p>

	<a href="{% url 'news_detail' object.id %}"> Читать далее</a>

    <p>{{object.date}}</p>

    <hr/>

    {% empty %} 

    No news yet. 

    {% endfor %} 
</ul>

{% endblock content %}
