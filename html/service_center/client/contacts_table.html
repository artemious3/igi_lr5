{% extends './base.html' %}

{% block styles %}

<link rel="stylesheet" href="/static/contacts_table.css">
<script src="/static/js/contacts.js"></script>

{% endblock styles %}

{% block content %}


<div class="filter-input-container">
    <p>Filter:</p>
    <input type="text" id="filter-input">
</div>

<table id="contacts">
    <thead>
        <tr>
            <td data-prop="selected">Select</td>
            <td>Image</td>
            <td data-prop="first_name">First Name</td>
            <td data-prop="last_name">Last Name</td>
            <td data-prop="email">Email</td>
            <td data-prop="phone_number">Phone</td>
            <td data-prop="specification">Specification</td>
        </tr>
    </thead>
    <tbody>

    </tbody>
</table>

{% endblock content %}
